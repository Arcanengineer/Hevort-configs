

[gcode_macro PRINT_START]
gcode:
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set BED = params.BED_TEMP|int %}
  {% set EXTRUDER = params.EXTRUDER_TEMP|int %}
  M400  ;Clear buffer
  G90  ;Set to absolute positioning
  
  # ==========================================
  # LÓGICA CONDICIONAL DE CÂMARA (O SEGREDO)
  # ==========================================
  {% if CHAMBER_TEMP > 40 %}
      M117 Modo Industrial: Heat Soak ativado...
      SET_IDLE_TIMEOUT TIMEOUT=3600
      SET_HEATER_TEMPERATURE HEATER="chamber" TARGET={CHAMBER_TEMP}
      M106 S64 # Blower a 25%
      
      M190 S{BED} # Aguarda a mesa
      TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={CHAMBER_TEMP} # Aguarda a câmara

      # Envia a mensagem pro Telegram:
  {action_call_remote_method("notify", name="telegram", message="Camara estabilizada! Iniciando a impressao no modo industrial.")}
      
      M106 S0
      SET_IDLE_TIMEOUT TIMEOUT=600
  {% else %}
      M117 Modo Rapido: Aquecendo apenas a mesa...
      M190 S{BED}  ;Set bed temperature and wait
      _WAIT TIME=180  ;Wait x seconds
  {% endif %}
  # ==========================================

  G28  ;Home all Axes
  SET_VELOCITY_LIMIT ACCEL=2000  ;Custom command
  BED_MESH_CLEAR  ;Clear Bed Mesh
  BED_MESH_CALIBRATE  ;Bed Mesh Calibration
  SET_VELOCITY_LIMIT ACCEL=18000  ;Custom command
  PARK_CENTER_FRONT  ;Park central front
  M109 S{EXTRUDER}  ;Set extruder temperature and wait
  _PURGE_LINE  ;Front Purge

#=============================================================================================================================

[delayed_gcode AVISA_MESA_FRIA]
gcode:
    # Captura a temperatura atual da mesa
    {% set TEMP_MESA = printer.heater_bed.temperature %}
    
    # Se estiver em 40C ou menos, manda a mensagem e o macro morre
    {% if TEMP_MESA <= 40 %}
        {action_call_remote_method("notify", name="telegram", message="A mesa esfriou! As pecas de ABS ja podem ser removidas sem risco de empenar.")}
    
    # Se ainda estiver quente, ele se auto-agenda para rodar de novo em 60 segundos
    {% else %}
        UPDATE_DELAYED_GCODE ID=AVISA_MESA_FRIA DURATION=60
    {% endif %}

#=============================================================================================================================

[gcode_macro PRINT_END]
gcode:
  G91  ;Set to relative positioning
  G1 E-2 F1800  ;Retract filament
  G90  ;Set to absolute positioning
  _MOVE_AWAY  ;Move away from print
  PARK_CENTER_REAR  ;Park central rear
  TURN_OFF_HEATERS  ;Turn off heaters
  M109 S175  ;Set extruder temperature and wait
  G91  ;Set to relative positioning
  G1 E-6 F1800  ;Retract filament
  TURN_OFF_HEATERS  ;Turn off heaters
    UPDATE_DELAYED_GCODE ID=AVISA_MESA_FRIA DURATION=60 # DISPARA O CRONÔMETRO DE RESFRIAMENTO EM SEGUNDO PLANO
  M84  ;Disable motors
  M400  ;Clear buffer
  G90  ;Set to absolute positioning
  DISPLAYTEXT  ;Display text


[gcode_macro M190]
rename_existing: M190.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M190.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}

[gcode_macro _WAIT]
gcode:
    {% set TIME = params.TIME|default(0)|int %}
    G4 P{TIME*1000}
[gcode_macro PARK_CENTER_FRONT]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% if printer["gcode_macro status_busy"] != null %}
    status_busy
  {% endif %}
    G0 X{th.axis_maximum.x//2} Y5 F3600  
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}


[gcode_macro M109]
rename_existing: M109.1
gcode:
  {% if printer["gcode_macro status_heating"] != null %}
    status_heating
  {% endif %}
    M109.1 { rawparams }
  {% if printer["gcode_macro status_ready"] != null %}
    status_ready
  {% endif %}


[gcode_macro _PURGE_LINE]
gcode:
  {% if printer["gcode_macro status_cleaning"] != null %}
    status_cleaning
  {% endif %}
  SAVE_GCODE_STATE NAME=Pre_Prime
        
  G90
  G92 E0 ;Reset Extruder

  G1 Z10.0 F3000 ;Move Z Axis up
  G1 X0 Y0;
  G1 E10.0 F1800
  G1 Z0.28 F5000.0 ;Move to start position
  G1 X220 Y0 Z0.28 F1500.0 E30 ;Draw the first line
  G92 E0 ;Reset Extruder
  G1 Z10 F3000 ;Move Z Axis up
  RESTORE_GCODE_STATE NAME=Pre_Prime

  {% if printer["gcode_macro status_printing"] != null %}
    status_printing
  {% endif %}


[gcode_macro _MOVE_AWAY]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
      
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing


[gcode_macro PARK_CENTER_REAR]
gcode:
    {% if printer["gcode_macro status_busy"] != null %}
      status_busy
    {% endif %}
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}

    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  
    {% if printer["gcode_macro status_ready"] != null %}
    status_ready
    {% endif %}


[gcode_macro DISPLAYTEXT]
gcode:
    {% set TEXT = params.TEXT|default("MANACORE COMPLETED ARTIFACT")|string %} #remove the .gcode from the file name for displaying from the Print_End Macro 
    RESPOND MSG="{TEXT}"
    M117 {TEXT}

